<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/index.css">
    <title>NoBusão - Consulta</title>
</head>

<body>

    <div class="top-bar">

        <div class="cabecalho">

            <h1>
                No<span>Busão</span>
            </h1>

            <a href="cadastro.html" class="btn-admin">
                Admin
            </a>

        </div>

        <form method="POST">

            <!-- PARTIDA -->

            <div class="bloco-rota">

                <h2>Partida</h2>

                <div class="form-group">

                    <label>
                        Bairro de Origem:
                    </label>

                    <select name="bairro_origem">

                        <option value="">
                            Selecione
                        </option>

                        <option>
                            Centro
                        </option>

                        <option>
                            Jardim América
                        </option>

                        <option>
                            Vila Nova
                        </option>

                    </select>

                </div>

                <div class="form-group">

                    <label>
                        Rua/Ponto de Origem:
                    </label>

                    <select name="rua_origem">

                        <option>
                            Selecione
                        </option>

                        <option>
                            Rua Principal
                        </option>

                        <option>
                            Avenida Brasil
                        </option>

                    </select>

                </div>

            </div>

            <!-- DESTINO -->

            <div class="bloco-rota">

                <h2>Destino</h2>

                <div class="form-group">

                    <label>
                        Bairro de Destino:
                    </label>

                    <select name="bairro_destino">

                        <option value="">
                            Selecione
                        </option>

                        <option>
                            Centro
                        </option>

                        <option>
                            Jardim América
                        </option>

                        <option>
                            Vila Nova
                        </option>

                    </select>

                </div>

                <div class="form-group">

                    <label>
                        Rua/Ponto de Destino:
                    </label>

                    <select name="rua_destino">

                        <option>
                            Selecione
                        </option>

                        <option>
                            Rua Principal
                        </option>

                        <option>
                            Avenida Brasil
                        </option>

                    </select>

                </div>

            </div>

            <button class="btn-calcular" name="calcular" type="submit">
                Calcular Rota
            </button>

        </form>

    </div>

</body>

</html>
